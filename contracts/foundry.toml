[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Updated to Shanghai for U2U Network compatibility
# U2U Network doesn't support Cancun opcodes (PUSH0)
evm_version = "shanghai"

# Use via-ir to avoid PUSH0 opcode in Solidity 0.8.20+
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
u2u_testnet = "https://rpc-nebulas-testnet.u2u.xyz"
u2u_mainnet = "https://rpc-mainnet.u2u.xyz"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
